<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peeback - Hoàn tiền mua hàng</title>
<meta name="theme-color" content="#E14E2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peeback">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: #FBF5EF; overflow: hidden; }
  #app-frame {
    position: fixed; inset: 0; width: 100%; height: 100%; border: none;
    padding-top: env(safe-area-inset-top, 0px);
  }
  #splash {
    position: fixed; inset: 0; background: #FBF5EF; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 10;
    transition: opacity .25s ease;
  }
  #splash img { width: 96px; height: 96px; }
  #splash .ring {
    width: 30px; height: 30px; border: 3px solid #E9DCCC; border-top-color: #E14E2C;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="splash">
  <img src="icon-192.png" alt="Peeback">
  <div class="ring"></div>
</div>

<!--
  DÁN ĐÚNG "Web app URL" CỦA BẠN (Deploy > Manage deployments) VÀO DÒNG src BÊN DƯỚI.
  Apps Script đã bật setXFrameOptionsMode(ALLOWALL) trong Code.gs nên nhúng
  được qua iframe bình thường.
-->
<iframe
  id="app-frame"
  src="https://script.google.com/macros/s/AKfycbx52r_fflvLDlPfC20QSU4v3OEYFqtaKkmpOFPNJfGzAdiLOd4K54SLVAimJhYUoNggIQ/exec"
  title="Peeback"
  allow="clipboard-write"
></iframe>

<script>
  var frame = document.getElementById('app-frame');
  var splash = document.getElementById('splash');
  frame.addEventListener('load', function () {
    setTimeout(function () { splash.classList.add('hide'); }, 200);
  });
  // Phòng trường hợp mạng chậm/lỗi, tự ẩn splash sau 8 giây để không kẹt màn hình chờ mãi
  setTimeout(function () { splash.classList.add('hide'); }, 8000);

  // Đăng ký service worker để app tải nhanh hơn ở lần mở sau
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function (err) {
        console.log('Service worker lỗi:', err);
      });
    });
  }
</script>

</body>
</html>
