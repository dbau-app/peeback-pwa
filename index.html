<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peeback - Hoàn tiền mua hàng</title>
<meta name="theme-color" content="#E14E2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Peeback">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: #FBF5EF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #splash {
    position: fixed; inset: 0; background: #FBF5EF; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 10; text-align: center; padding: 20px;
  }
  #splash img { width: 96px; height: 96px; border-radius: 20px; }
  #splash .ring {
    width: 32px; height: 32px; border: 3px solid #E9DCCC; border-top-color: #E14E2C;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  #splash p { color: #555; font-size: 14px; margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="splash">
  <img src="icon-192.png" alt="Peeback">
  <div class="ring"></div>
  <p>Đang kết nối tới Peeback...</p>
</div>

<script>
  // Link Web App Apps Script chính thức của bạn
  var targetUrl = "https://script.google.com/macros/s/AKfycbx52r_fflvLDlPfC20QSU4v3OEYFqtaKkmpOFPNJfGzAdiLOd4K54SLVAimJhYUoNggIQ/exec";

  // Đăng ký Service Worker cho PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(function (err) {
      console.log('SW error:', err);
    });
  }

  // Chuyển hướng ngay lập tức để tránh lỗi iframe đa tài khoản Chrome
  window.location.replace(targetUrl);
</script>

</body>
</html>
